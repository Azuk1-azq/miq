<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>名言画像メーカー</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+1p&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
/* Layout: 画像プレビューを主役に、右側(スマホでは下)に入力欄を置く2カラム */
:root{
  --bg:#e9ecea;          /* 紙のような薄い緑灰 */
  --panel:#f7f8f7;
  --ink:#141716;
  --sub:#5d6462;
  --line:#c9cfcc;
  --accent:#2b45d3;
  --accent-ink:#ffffff;
  --shadow:rgba(20,23,22,.16);
  --ui:'Zen Kaku Gothic New','Hiragino Sans','Yu Gothic UI','Noto Sans JP',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101312;--panel:#181c1b;--ink:#e8ecea;--sub:#99a29f;--line:#2c3331;--accent:#8fa0ff;--accent-ink:#0d1030;--shadow:rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101312;--panel:#181c1b;--ink:#e8ecea;--sub:#99a29f;--line:#2c3331;--accent:#8fa0ff;--accent-ink:#0d1030;--shadow:rgba(0,0,0,.5);color-scheme:dark}

*{box-sizing:border-box}
body{
  background:var(--bg);color:var(--ink);font:15px/1.7 var(--ui);
  padding-block:28px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.wrap{max-width:1160px;margin:0 auto;display:grid;gap:20px}
header h1{margin:0;font-size:24px;line-height:1.3;letter-spacing:.02em;text-wrap:balance}
header p{margin:4px 0 0;color:var(--sub);font-size:14px}
.layout{display:grid;gap:24px;grid-template-columns:minmax(0,1fr) 340px;align-items:start}
@media (max-width:860px){.layout{grid-template-columns:minmax(0,1fr)}}

.stage{min-width:0;display:grid;gap:12px}
.canvas-box{border:1px solid var(--line);box-shadow:0 10px 30px var(--shadow);line-height:0;background:#000}
#cv{display:block;width:100%;height:auto;aspect-ratio:1200/630}
.canvas-box.drop{outline:2px dashed var(--accent);outline-offset:4px}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.note{color:var(--sub);font-size:13px;margin:0}

.panel{min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:20px;display:grid;gap:18px}
.field{display:grid;gap:6px;min-width:0}
.field>label,.field>legend{font-weight:700;font-size:14px;padding:0}
fieldset.field{border:0;margin:0;padding:0}
textarea,input[type=text]{
  width:100%;min-width:0;font:inherit;color:var(--ink);background:var(--bg);
  border:1px solid var(--line);border-radius:4px;padding:9px 11px;
}
textarea{resize:vertical;min-height:112px;line-height:1.6}
.hint{color:var(--sub);font-size:12.5px;line-height:1.55}
.count{justify-self:end;color:var(--sub);font-size:12px;font-variant-numeric:tabular-nums}

.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg label{display:block;text-align:center;padding:8px 6px;cursor:pointer;background:var(--bg);font-size:14px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg input:checked+span{display:block;margin:-8px -6px;padding:8px 6px;background:var(--ink);color:var(--bg);font-weight:700}
.seg label+label{border-left:1px solid var(--line)}
.seg label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:-2px}

.check{display:flex;gap:10px;align-items:center;cursor:pointer;font-size:14px}
.check input{width:18px;height:18px;accent-color:var(--accent);margin:0}

button,.btn{
  font:inherit;font-size:14px;border-radius:4px;padding:9px 16px;cursor:pointer;
  border:1px solid var(--line);background:var(--panel);color:var(--ink);
}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
button:hover,.btn:hover{border-color:var(--ink)}
button.primary:hover{filter:brightness(1.08)}
button:disabled{opacity:.5;cursor:default}
.file-row{display:flex;flex-wrap:wrap;gap:8px}
.file-row input[type=file]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.btn:has(input:focus-visible),button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.status{min-height:1.6em;color:var(--sub);font-size:13px;margin:0}
</style>
</head>
<body>


<div class="wrap">

  <div class="layout">
    <section class="stage" aria-label="プレビュー">
      <div class="canvas-box" id="box">
        <canvas id="cv" width="1200" height="630" role="img" aria-label="名言画像のプレビュー"></canvas>
      </div>
      <div class="actions">
        <button class="primary" id="save" type="button">画像を保存</button>
        <button id="copy" type="button">画像をコピー</button>
        <p class="status" id="status" role="status" aria-live="polite"></p>
      </div>
    </section>

    <section class="panel" aria-label="入力">
      <div class="field">
        <label for="text">名言</label>
        <textarea id="text" maxlength="200">名言をここに入力</textarea>
        <div class="count" id="count">0 / 200</div>
      </div>

      <div class="field">
        <label for="author">表示する名前</label>
        <input type="text" id="author" maxlength="30" value="名前" autocomplete="off">
      </div>

      <div class="field">
        <label for="handle">ユーザー名(@の後ろ)</label>
        <input type="text" id="handle" maxlength="32" value="username" autocomplete="off" autocapitalize="off" spellcheck="false">
      </div>

      <fieldset class="field">
        <legend>背景の色</legend>
        <div class="seg">
          <label><input type="radio" name="style" value="black" checked><span>ブラック</span></label>
          <label><input type="radio" name="style" value="white"><span>ホワイト</span></label>
        </div>
      </fieldset>

      <fieldset class="field">
        <legend>アイコンの色</legend>
        <div class="seg">
          <label><input type="radio" name="tone" value="mono" checked><span>モノクロ</span></label>
          <label><input type="radio" name="tone" value="color"><span>カラー</span></label>
        </div>
      </fieldset>

      <div class="field">
        <label class="check"><input type="checkbox" id="mark" checked>右下に文字を表示する</label>
        <input type="text" id="marktext" maxlength="40" value="Make it a Quote#6660" aria-label="右下に表示する文字" autocomplete="off">
      </div>

      <div class="field">
        <label for="file">アイコン画像</label>
        <div class="file-row">
          <label class="btn" for="file">画像を選ぶ</label>
          <input type="file" id="file" accept="image/*">
          <button type="button" id="reset">サンプルに戻す</button>
        </div>
      </div>
    </section>
  </div>
</div>

<script>
(function(){
"use strict";
/* ===== 名言画像の寸法・配置(Discord BOT の bot.py と同じ値) ===== */
const MG={W:1200,H:630,CX:855,AREA_W:590,TITLE_MAX:60,TITLE_MIN:20,AUTHOR:35,HANDLE:20,
  SHEAR:0.17,AUTHOR_DX:1.5,TITLE_BASE:306,GAP_AUTHOR:66,GAP_HANDLE:30,TOP_RATIO:49/60,
  BOTTOM_OFF:2,LINE_RATIO:1.35,FADE:[220,570],BLOCK_MAX:520};
const KIN=new Set(Array.from("、。，．・」』）】〉》〕｝！？!?,.)]}:;…ー々ぁぃぅぇぉっゃゅょゎァィゥェォッャュョヮ")); // 行頭禁則
const OPEN=new Set(Array.from("「『（【〈《〔｛([{"));                                                 // 行末禁則
const TOKEN=/[A-Za-z0-9_'’\-]+|\s+|[\s\S]/gu;
const FAM='"M PLUS 1p","Hiragino Sans","Noto Sans JP",sans-serif';

const cv=document.getElementById("cv"),ctx=cv.getContext("2d");
const $=id=>document.getElementById(id);
const el={text:$("text"),author:$("author"),handle:$("handle"),mark:$("mark"),marktext:$("marktext"),file:$("file"),
  count:$("count"),status:$("status"),box:$("box"),save:$("save"),copy:$("copy"),reset:$("reset"),hint:$("saveHint")};

function m(size,t){ctx.font="400 "+size+"px "+FAM;return ctx.measureText(t).width;}

/* 幅に合わせた自動改行。句読点の行頭・開き括弧の行末を避け、英単語は途中で切らない */
function wrap(text,size,maxW){
  const lines=[];
  for(const para of text.split("\n")){
    let cur="";
    for(const tok of (para.match(TOKEN)||[])){
      const sp=/^\s+$/.test(tok);
      if(!cur&&sp)continue;
      if(m(size,cur+tok)<=maxW||(cur&&KIN.has(tok))){cur+=tok;continue;}
      let tail="";
      if(cur){const a=Array.from(cur);if(OPEN.has(a[a.length-1])){tail=a.pop();cur=a.join("");}}
      if(cur.trim())lines.push(cur.trimEnd());
      cur=tail;
      if(sp)continue;
      if(m(size,cur+tok)>maxW){
        for(const ch of tok){
          if(cur&&m(size,cur+ch)>maxW&&!KIN.has(ch)){lines.push(cur);cur=ch;}else cur+=ch;
        }
      }else cur+=tok;
    }
    lines.push(cur);
  }
  return lines;
}
function ellipsize(t,size,maxW){
  if(m(size,t)<=maxW)return t;
  let a=Array.from(t);
  while(a.length&&m(size,a.join("")+"…")>maxW)a.pop();
  return a.join("")+"…";
}

/* ===== アイコン ===== */
let avatar=null,avatarId=0,layerKey="",layer=null;

function sampleAvatar(){
  const c=document.createElement("canvas");c.width=c.height=1024;
  const g=c.getContext("2d");
  g.fillStyle="#8a8f94";g.fillRect(0,0,1024,1024);
  g.fillStyle="#c9cdd1";
  g.beginPath();g.arc(512,420,170,0,Math.PI*2);g.fill();
  g.beginPath();g.ellipse(512,1010,340,360,0,Math.PI,0);g.fill();
  return c;
}
function toSquare(img,w,h){ // 中央で正方形に切り抜く(ImageOps.fit 相当)
  const s=Math.min(w,h),c=document.createElement("canvas");
  c.width=c.height=Math.min(1024,s);
  const g=c.getContext("2d");g.imageSmoothingQuality="high";
  g.drawImage(img,(w-s)/2,(h-s)/2,s,s,0,0,c.width,c.height);
  return c;
}
async function loadFile(file){
  if(!file||!/^image\//.test(file.type)){say("画像ファイルを選んでください。");return;}
  try{
    let sq;
    if(window.createImageBitmap){
      const bmp=await createImageBitmap(file);sq=toSquare(bmp,bmp.width,bmp.height);
    }else{
      sq=await new Promise((ok,ng)=>{
        const u=URL.createObjectURL(file),im=new Image();
        im.onload=()=>{ok(toSquare(im,im.naturalWidth,im.naturalHeight));URL.revokeObjectURL(u);};
        im.onerror=ng;im.src=u;
      });
    }
    avatar=sq;avatarId++;say("");render();
  }catch(e){say("この画像は読み込めませんでした。別の画像を選んでください。");}
}

/* 左から右へ smoothstep で背景色に溶かしたアイコン層を作る */
function buildLayer(dark,color){
  const key=avatarId+"|"+dark+"|"+color;
  if(key===layerKey&&layer)return layer;
  const H=MG.H,bg=dark?0:245;
  const off=document.createElement("canvas");off.width=off.height=H;
  const o=off.getContext("2d",{willReadFrequently:true});
  o.fillStyle="rgb("+bg+","+bg+","+bg+")";o.fillRect(0,0,H,H);
  o.imageSmoothingQuality="high";
  o.drawImage(avatar,0,0,avatar.width,avatar.height,0,0,H,H);
  const d=o.getImageData(0,0,H,H),px=d.data,[f0,f1]=MG.FADE;
  for(let x=0;x<H;x++){
    const t=Math.min(1,Math.max(0,(x-f0)/(f1-f0)));
    const al=Math.round(255*(1-t*t*(3-2*t)));
    for(let y=0;y<H;y++){
      const i=(y*H+x)*4;
      if(!color){const l=Math.round((px[i]*299+px[i+1]*587+px[i+2]*114)/1000);px[i]=px[i+1]=px[i+2]=l;}
      px[i+3]=al;
    }
  }
  o.putImageData(d,0,0);
  layerKey=key;layer=off;return off;
}

/* ===== 描画 ===== */
let token=0;
function isColor(){return document.querySelector('input[name=tone]:checked').value==="color";}
function currentText(){return el.text.value.replace(/\r\n?/g,"\n").replace(/\\n/g,"\n");}

async function render(){
  const my=++token;
  const text=currentText(),author=el.author.value||"名無し",handle="@"+(el.handle.value||"user");
  try{await document.fonts.load('400 60px "M PLUS 1p"',text+author+handle+el.marktext.value+"-@…0123456789abcdefghijklmnopqrstuvwxyz");}catch(e){}
  if(my!==token)return;
  const dark=document.querySelector('input[name=style]:checked').value==="black";
  const fg=dark?"rgb(250,250,250)":"rgb(10,10,10)",sub=dark?"rgb(70,70,70)":"rgb(185,185,185)",bg=dark?"#000":"rgb(245,245,245)";
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle=bg;ctx.fillRect(0,0,MG.W,MG.H);
  ctx.drawImage(buildLayer(dark,isColor()),0,0);
  drawQuote(text,author,handle,fg,sub);
  if(el.mark.checked&&el.marktext.value.trim()){
    const mt=ellipsize(el.marktext.value.trim(),22,600);
    ctx.font="400 22px "+FAM;ctx.textAlign="right";ctx.textBaseline="alphabetic";
    ctx.fillStyle=dark?"rgb(140,140,140)":"rgb(120,120,120)";
    ctx.fillText(mt,MG.W-10,MG.H-16);
  }
}

function drawQuote(text,author,handle,fg,sub){
  let size=MG.TITLE_MAX,lines=[],lh=0,fixed=0,fit=false;
  for(size=MG.TITLE_MAX;size>=MG.TITLE_MIN;size-=2){ // 収まる最大サイズを探す
    lines=wrap(text,size,MG.AREA_W);
    lh=Math.round(size*MG.LINE_RATIO);
    fixed=MG.TOP_RATIO*size+MG.GAP_AUTHOR+MG.GAP_HANDLE+MG.BOTTOM_OFF;
    if(fixed+(lines.length-1)*lh<=MG.BLOCK_MAX){fit=true;break;}
  }
  if(!fit){
    size=MG.TITLE_MIN;
    const keep=Math.max(1,Math.floor((MG.BLOCK_MAX-fixed)/lh)+1);
    if(lines.length>keep){lines=lines.slice(0,keep);lines[lines.length-1]=ellipsize(lines[lines.length-1].trimEnd()+"…",size,MG.AREA_W);}
  }
  const n=lines.length,topOff=MG.TOP_RATIO*size;
  const blockH=topOff+(n-1)*lh+MG.GAP_AUTHOR+MG.GAP_HANDLE+MG.BOTTOM_OFF;
  // 1行のとき名言の基準線が TITLE_BASE になるよう、同じ中心から上下に広げる
  const center=(MG.TITLE_BASE-MG.TOP_RATIO*MG.TITLE_MAX+MG.TITLE_BASE+MG.GAP_AUTHOR+MG.GAP_HANDLE+MG.BOTTOM_OFF)/2;
  const base=center-blockH/2+topOff;
  ctx.textBaseline="alphabetic";ctx.textAlign="left";ctx.fillStyle=fg;
  ctx.font="400 "+size+"px "+FAM;
  lines.forEach((ln,i)=>ctx.fillText(ln,MG.CX-m(size,ln)/2,base+i*lh));
  const aBase=base+(n-1)*lh+MG.GAP_AUTHOR,hBase=aBase+MG.GAP_HANDLE;
  // 作者行: 日本語フォントに斜体が無いので、基準線を軸に傾けて擬似斜体にする
  const at=ellipsize("- "+author,MG.AUTHOR,MG.AREA_W);
  ctx.save();
  ctx.translate(MG.CX+MG.AUTHOR_DX,aBase);ctx.transform(1,0,-MG.SHEAR,1,0,0);
  ctx.font="400 "+MG.AUTHOR+"px "+FAM;ctx.textAlign="center";ctx.fillStyle=fg;
  ctx.fillText(at,0,0);
  ctx.restore();
  const ht=ellipsize(handle,MG.HANDLE,MG.AREA_W);
  ctx.font="400 "+MG.HANDLE+"px "+FAM;ctx.textAlign="left";ctx.fillStyle=sub;
  ctx.fillText(ht,MG.CX-m(MG.HANDLE,ht)/2,hBase);
}

/* ===== 操作 ===== */
function say(t){el.status.textContent=t;}
let timer=0;
function later(){clearTimeout(timer);timer=setTimeout(render,60);}
function updateCount(){el.count.textContent=Array.from(el.text.value).length+" / 200";}

["input","change"].forEach(ev=>{
  el.text.addEventListener(ev,()=>{updateCount();later();});
  el.author.addEventListener(ev,later);
  el.handle.addEventListener(ev,later);
  el.marktext.addEventListener(ev,later);
  el.mark.addEventListener(ev,later);
});
document.querySelectorAll('input[name=tone]').forEach(r=>r.addEventListener("change",later));
document.querySelectorAll('input[name=style]').forEach(r=>r.addEventListener("change",later));
el.file.addEventListener("change",()=>{loadFile(el.file.files[0]);el.file.value="";});
el.reset.addEventListener("click",()=>{avatar=sampleAvatar();avatarId++;say("");render();});

["dragenter","dragover"].forEach(ev=>el.box.addEventListener(ev,e=>{e.preventDefault();el.box.classList.add("drop");}));
["dragleave","drop"].forEach(ev=>el.box.addEventListener(ev,e=>{e.preventDefault();el.box.classList.remove("drop");}));
el.box.addEventListener("drop",e=>{const f=e.dataTransfer&&e.dataTransfer.files[0];if(f)loadFile(f);});

function toBlob(){return new Promise((ok,ng)=>cv.toBlob(b=>b?ok(b):ng(new Error("blob")),"image/png"));}

let dl=undefined;
async function getDownloads(){
  if(dl!==undefined)return dl;
  try{dl=(window.claude&&window.claude.use)?await window.claude.use("downloads"):null;}catch(e){dl=null;}
  return dl;
}
el.save.addEventListener("click",async()=>{
  await render();
  let blob;
  try{blob=await toBlob();}catch(e){say("画像を作れませんでした。もう一度お試しください。");return;}
  const d=await getDownloads();
  if(d){
    try{await d.save({filename:"meigen.png",data:blob});say("保存しました。");}
    catch(e){say(e&&e.code==="declined"?"保存をキャンセルしました。":"保存できませんでした。プレビューを右クリックして保存してください。");}
    return;
  }
  const u=URL.createObjectURL(blob),a=document.createElement("a");
  a.href=u;a.download="meigen.png";document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),4000);
  say("保存を開始しました。始まらないときは、プレビューを右クリックして保存してください。");
});
el.copy.addEventListener("click",async()=>{
  await render();
  try{
    const blob=await toBlob();
    await navigator.clipboard.write([new ClipboardItem({"image/png":blob})]);
    say("画像をコピーしました。");
  }catch(e){say("この環境ではコピーできません。「画像を保存」を使ってください。");}
});
if(!window.ClipboardItem||!navigator.clipboard||!navigator.clipboard.write)el.copy.hidden=true;

/* 最初の表示 */
avatar=sampleAvatar();avatarId=1;
updateCount();
render();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>render());
})();
</script>

</body>
</html>
